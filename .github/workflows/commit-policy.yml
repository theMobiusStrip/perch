name: Commit policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  statuses: write

concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: trusted commit policy
    runs-on: ubuntu-latest
    steps:
      - name: Mark policy pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context=commitlint/trusted \
            -f description="Checking authored commit messages" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/commitlint/package-lock.json

      - name: Install trusted commit policy
        run: npm ci --prefix tools/commitlint --ignore-scripts

      - name: Validate PR commits
        id: policy
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags --force origin \
            "pull/$PR_NUMBER/head:refs/remotes/origin/perch-policy-head"
          test "$(git rev-parse refs/remotes/origin/perch-policy-head)" = "$HEAD_SHA"
          scripts/check-commits.sh range "$BASE_SHA" "$HEAD_SHA"

      - name: Publish policy result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          description="Authored commit messages do not satisfy policy"
          if [[ "$POLICY_OUTCOME" == success ]]; then
            state=success
            description="Authored commit messages satisfy policy"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=commitlint/trusted \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
