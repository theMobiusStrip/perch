name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Extract version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          response="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            2>&1)"
          api_exit=$?
          set -e
          http_code="$(printf '%s\n' "$response" | awk 'NR == 1 { print $2 }')"

          case "$http_code" in
            404) ;;
            200)
              echo "::error::Release ${RELEASE_TAG} already exists; refusing to overwrite signed artifacts. Delete an unpublished draft before retrying."
              exit 1
              ;;
            *)
              printf '%s\n' "$response" >&2
              echo "::error::Could not verify that the release tag is unused (gh exit $api_exit)."
              exit 1
              ;;
          esac

      - name: Build app + selftest
        run: |
          make app
          .build/release/Perch --selftest

      - name: Build DMG
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: SKIP_BUILD=1 scripts/build-dmg.sh "$RELEASE_TAG"

      - name: Attest DMG provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/Perch-${{ steps.version.outputs.version }}-arm64.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The maintainer's signing key is hardware-backed. Keep the release
          # private until its checksum signature has been uploaded manually.
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/Perch-${{ steps.version.outputs.version }}-arm64.dmg
            dist/Perch-${{ steps.version.outputs.version }}-arm64.dmg.sha256
          body: |
            ## Install

            **Requires an Apple silicon Mac (M1 or later), macOS 14+.** The DMG is arm64-only; Intel Macs are not supported.

            1. Download the `.dmg` below
            2. Open it and drag **Perch** to **Applications**
            3. First launch only — Perch is open-source and ad-hoc signed, not Apple-notarized, so macOS asks once:
               - **macOS 14 (Sonoma):** right-click Perch.app → **Open** → click **Open**
               - **macOS 15+ (Sequoia):** double-click Perch.app, close the warning, then open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**
            4. Launch Perch, then open **Monitoring Setup…** from the menu bar.
               Install monitoring for Claude Code and/or Codex, restart each configured agent,
               and confirm **Live verification** receives a real event.

            ## Verify your download

            Download the `.dmg`, `.sha256`, and `.sha256.asc` files into the same folder.

            **Step 1 — Integrity:** the DMG matches the published checksum

            ```sh
            cd ~/Downloads
            shasum -a 256 --check "Perch-${{ steps.version.outputs.version }}-arm64.dmg.sha256"
            # expected: Perch-…-arm64.dmg: OK
            ```

            **Step 2 — Maintainer signature:** the checksum was signed by Perch's maintainer

            ```sh
            curl -fsSL https://github.com/theMobiusStrip.gpg | gpg --import
            gpg --verify \
              "Perch-${{ steps.version.outputs.version }}-arm64.dmg.sha256.asc" \
              "Perch-${{ steps.version.outputs.version }}-arm64.dmg.sha256"
            # expected: Good signature from "Evan Zheng …"
            ```

            A "not certified with a trusted signature" warning is normal unless you have
            independently marked the maintainer key as trusted. The signature must still be good.

            **Step 3 — Build provenance:** the DMG came from Perch's release workflow and tag

            ```sh
            gh attestation verify "Perch-${{ steps.version.outputs.version }}-arm64.dmg" \
              --repo theMobiusStrip/perch \
              --signer-workflow theMobiusStrip/perch/.github/workflows/release.yml \
              --source-ref "refs/tags/${{ steps.version.outputs.tag }}"
            ```

            The provenance check requires the GitHub CLI. It binds the DMG digest to this repository, release workflow, and tag.
