name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/commitlint/package-lock.json
      - name: Install commit policy
        run: npm ci --prefix tools/commitlint --ignore-scripts
      - name: Check introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-commits.sh range "$BASE_SHA" "$HEAD_SHA"

  macos:
    name: macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Swift 6 toolchain on macOS 14
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Toolchain diagnostics
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      # Build-free invariant tripwire (bare-^ command anchor, read-only). Fast,
      # so it fails before the expensive compile when an invariant is broken.
      - name: Fitness invariants
        run: make fitness
      - name: Build (release)
        run: swift build -c release
      - name: Selftest
        run: .build/release/Perch --selftest
      # Metamorphic gate: a monotone violation (a more-dangerous rewrite that
      # LOWERS the risk level) is a detection bypass and fails the build.
      - name: Metamorphic oracle
        run: make meta

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [commitlint, macos]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Require every gate
        env:
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$COMMITLINT_RESULT" = success
          test "$MACOS_RESULT" = success
